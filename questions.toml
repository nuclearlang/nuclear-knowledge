# The questions people and agents ask the Smart Graph, and the row each must return (ADR-0104): the acceptance test
# of the knowledge base. `nuclear-graph knowledge ask` runs them against the running graph and fails when one does not
# come back among its first `top` results (3 by default).
#
# `expect`: any of these ids counts; an id that ends with `*` is a prefix. `agents` (default true): search as a local
# agent does. `platform`, `shelves`, `kind`: the filters of the search. Questions come in English and in Spanish:
# people ask in both. When a change answers a new question, add it here with the change.
#
# `request = true`: the text is an order or a spec, not a question: it is given to the strategy selection and its first
# strategy must be the expected one; `existing` and `new` are the declarations it names that a project has or lacks.
#
# `says`: the question is also asked to the local assistant (`eval/run.py chat` in nuclear-developer, the chat of the
# editor): its answer must contain every one of these texts (the case does not matter).

