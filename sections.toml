# The knowledge base of NuclearLang and Dragonfly, step by step: what a person or an agent reads, in this order, to
# know the whole project. Each section lists the files of the working tree it holds (globs from the tree's root; the
# website is `website/`). `nuclear-graph knowledge build` copies every file as it is (not a comma changes) into
# `<section>/<path>`; a file no section claims goes to `99-other`, so none is ever left out; `nuclear-graph knowledge
# check` fails when the copy and the sources differ.
#
# `agents = false`: the local agents of the Nuclear Developer do not read the section (they write only Nuclear: the
# target languages' specs, the dialects' internals and the runtimes are for people and frontier models). Everything
# is in the Smart Graph's `knowledge` collection; the agents read the rest, without target-language code.

# The website's checkout (a repository of its own, outside the working tree).
website = "~/Documents/projects/nuc/react/nuclearlang_website"

exclude = [
  "**/CLAUDE.md",                 # one line that imports AGENTS.md
  "**/icon-themes/**", "**/icons/atom/**", "**/vendor/**",
  "tools/defs/flutter_project/**",
  "nuclear-developer/data/**",    # this repository
]

[[section]]
id = "01-introduction"
title = "What NuclearLang and Dragonfly are"
files = [
  "README.md", "AGENTS.md", "docs/context/product/prd.md", "docs/context/README.md", "docs/architecture.md",
  "docs/context/architecture.md", "docs/context/tech.md", "docs/context/workflow.md", "CONTRIBUTING.md",
  "CHANGELOG.md", "github-profile/**", "specs/README.md",
]

