# The documents of the working tree, in reading order: which markdown files the knowledge base holds, on which shelf
# of the Smart Graph each one goes and who reads it (ADR-0104). `nuclear-graph knowledge build` cuts every file into
# one row per heading section and writes them to `assets/<shelf>/<section id>.json`; a file no section claims is a
# problem the build reports, so none is ever left out.
#
# `shelf`: `docs` (the default: the long form), `language` (the base language: its guide and rules) or `platforms`
# (the rules of a platform). Everything with a structure of its own is not listed here, because its rows are read from
# its source: the diagnostics, the standard library, the kinds and decorators (platform.toml, docs.toml), the help of
# the command line tools, the MCP tools, the examples (.nuc).
#
# `agents = false`: the local agents of the Nuclear Developer do not read the section (they write only Nuclear: the
# target languages, the dialects underneath, the runtimes, the decisions and the state are for people and frontier
# models). In a section they read, the code blocks of a target language are left out of the rows.

# The website's checkout (a repository of its own, outside the working tree).
website = "~/Documents/projects/nuc/react/nuclearlang_website"

exclude = [
  "**/CLAUDE.md",                 # one line that imports AGENTS.md
  "**/icon-themes/**", "**/icons/atom/**", "**/vendor/**",
  "tools/defs/flutter_project/**",
  "nuclear-developer/data/**",    # this repository
  "nuclear-graph/src/**",         # the prompt files: the graph's `prompts` collection
  "spec/diagnostics.md",          # one row per diagnostic, read from the compiler (assets/errors/diagnostics.json)
  "STATUS.md",                    # the state and the log change with every task: what matters of them for a reader of
                                  # the graph is in `capabilities` rows that name STATUS.md's sections as their sources
]

[[section]]
id = "01-introduction"
title = "What NuclearLang and Dragonfly are"
files = [
  "README.md", "AGENTS.md", "docs/context/product/prd.md", "docs/context/README.md", "docs/architecture.md",
  "docs/context/architecture.md", "docs/context/tech.md", "docs/context/workflow.md", "CONTRIBUTING.md",
  "CHANGELOG.md", "github-profile/**", "specs/README.md",
]

[[section]]
id = "02-language"
